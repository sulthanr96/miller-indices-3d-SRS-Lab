<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miller Indices 3D Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; }
        /* Hide number input arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        canvas {
            outline: none;
        }
    </style>
    <!-- Map Three.js modules -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body class="bg-slate-50 h-screen flex flex-col font-sans text-gray-800 selection:bg-blue-200">
    <!-- Header Controls -->
    <header class="bg-white/90 backdrop-blur shadow-sm px-4 py-3 flex flex-col md:flex-row justify-between items-center z-10 border-b border-gray-200 gap-4">
        <div class="flex items-center space-x-3 w-full md:w-auto justify-center md:justify-start">
            <div class="bg-violet-600 text-white p-2 rounded-lg shadow-inner">
                <i class="fas fa-cube text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-gray-800 leading-tight">Miller Indices 3D</h1>
            </div>
        </div>
        
        <div class="flex space-x-3 items-center w-full md:w-auto justify-between md:justify-end flex-wrap gap-y-2">
            
            <!-- Mode Toggle -->
            <div class="flex items-center bg-gray-100 p-1 rounded-lg border border-gray-200 shadow-inner">
                <button id="mode-view-btn" class="px-4 py-1.5 rounded-md bg-white shadow-sm text-sm font-bold text-violet-600 transition-all">View Mode</button>
                <button id="mode-draw-btn" class="px-4 py-1.5 rounded-md text-sm font-bold text-gray-500 hover:text-gray-700 transition-all">Draw Mode</button>
            </div>

            <!-- Indices Inputs -->
            <div class="flex items-center space-x-2 bg-gray-50 p-1.5 rounded-xl border border-gray-200 shadow-inner">
                <span class="font-bold text-gray-400 text-lg pl-1">(</span>
                <input type="number" id="h-input" value="1" class="w-10 h-10 text-center font-bold text-lg bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-violet-500 transition-all">
                <input type="number" id="k-input" value="1" class="w-10 h-10 text-center font-bold text-lg bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-violet-500 transition-all">
                <input type="number" id="l-input" value="1" class="w-10 h-10 text-center font-bold text-lg bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-violet-500 transition-all">
                <span class="font-bold text-gray-400 text-lg pr-1">)</span>
            </div>
            
            <button id="reset-btn" class="bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 font-semibold py-2 px-3 rounded-xl shadow hover:shadow-md transition-all flex items-center space-x-2 border border-gray-300">
                <i class="fas fa-sync-alt"></i>
            </button>
            
            <button id="export-btn" class="bg-violet-600 hover:bg-violet-700 active:bg-violet-800 text-white font-semibold py-2 px-3 rounded-xl shadow hover:shadow-md transition-all flex items-center space-x-2 border border-violet-700">
                <i class="fas fa-camera"></i>
            </button>
        </div>
    </header>

    <!-- Main Canvas Area -->
    <main class="flex-grow relative">
        <div id="canvas-container" class="absolute inset-0 cursor-move"></div>
        
        <!-- Legend / Info Box -->
        <div id="instructions-box" class="absolute bottom-4 left-4 bg-white/90 backdrop-blur-md p-4 rounded-xl shadow-lg border border-gray-200/50 pointer-events-none max-w-[280px] md:max-w-sm transition-all duration-300">
            <h3 class="font-bold text-gray-800 mb-2 flex items-center gap-2">
                <i class="fas fa-info-circle text-violet-500"></i> <span id="instruction-title">View Mode</span>
            </h3>
            <ul id="instruction-list" class="text-xs md:text-sm text-gray-600 space-y-1.5 list-disc pl-5">
                <li>Change <strong>(h k l)</strong> values to visualize planes.</li>
                <li>For negative indices (e.g. 1̄), use <strong>-1</strong></li>
                <li><strong>Left Click + Drag</strong> to rotate.</li>
                <li><strong>Scroll</strong> to zoom in/out.</li>
            </ul>
        </div>
        
        <a href="https://github.com" target="_blank" class="absolute bottom-4 right-4 bg-white/80 backdrop-blur-md p-3 rounded-full shadow-lg border border-gray-200/50 hover:bg-gray-100 transition-colors text-gray-700 hover:text-black">
            <i class="fab fa-github text-xl"></i>
        </a>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
